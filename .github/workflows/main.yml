name: Test Build yarn

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn lint:ts
  # Job 2: Unit Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn build:prod
  # Job 4: Storybook Build
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - name: Install Playwright Browsers
        # IMPORTANT: Even if you don't use Playwright for writing tests,
        # the test-runner needs the Chromium browser to take the screenshots.
        run: npx playwright install chromium --with-deps

      - name: Run Storybook Tests (Snapshots)
        run: yarn test-storybook:ci
